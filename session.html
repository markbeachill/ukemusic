<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ukemusic: Session screen</title>
<style>
/* Session screen (4.35): a song fitted to one screen for a group to play from. The screen itself is
   src/session-screen.js (shared with the web player); this window just feeds it. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
#screen { height: 100%; }
</style>
</head>
<body>
<div id="screen"></div>
<script src="src/session-fit.js"></script>
<script src="src/session-screen.js"></script>
<script>
(() => {
  const U = window.ukemusic;
  // 4.89: the music stand view (size 'book') has its own bar (Close, Go to, text size), shown with a
  // tap at the top; the Session screen on a TV is worked from the laptop's bar instead
  let screen = null;
  let standBar = null;
  const make = (stand) => {
    if (screen && standBar === stand) return screen;
    if (screen) screen.destroy();
    standBar = stand;
    screen = UkeSessionScreen.create(document.getElementById('screen'), {
      css: U.sessionCss(),
      onState: (state) => U.session.sendState(state),
      onClose: () => U.session.close(),
      closeButton: stand
    });
    return screen;
  };
  document.addEventListener('keydown', (e) => { if (screen && screen.key(e.key)) e.preventDefault(); });
  U.session.onKey((k) => screen && screen.key(k));
  U.session.onPlaying((info) => screen && screen.playing(info)); // 4.74: the line playing, lit
  U.session.onData(async (data) => {
    make(data.size === 'book');
    document.title = data.size === 'book' ? 'ukemusic: Music stand' : 'ukemusic: Session screen';
    document.body.style.background = data.dark || data.theme === 'dark' || data.theme === 'contrast' ? '#000' : '#fff';
    // 4.71: Easy to read text (Atkinson Hyperlegible), as in the main window
    if (data.easyRead && !document.getElementById('easyReadCss')) document.head.insertAdjacentHTML('beforeend', `<style id="easyReadCss">${U.easyReadCss()}</style>`);
    document.documentElement.toggleAttribute('data-easy-read', data.easyRead === true);
    if (data.check) {
      // the fits-one-screen check: lay out every song and report
      await document.fonts?.ready;
      screen.show({ ...data, songs: data.songs || [] });
      U.session.sendChecked({ width: innerWidth, height: innerHeight, minPx: screen.minPx, songs: screen.check() });
      return;
    }
    screen.show(data);
  });
})();
</script>
</body>
</html>
